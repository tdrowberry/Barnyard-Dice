# Render Blueprint - https://render.com/docs/blueprint-spec
# Deployed and live at https://barnyard-dice.onrender.com/
#
# This is a real-time multiplayer server (Express + Socket.IO), not a
# static site -- it needs a live Node process, which is why this can't
# go on GitHub Pages the way the other project pages do.
services:
  - type: web
    name: barnyard-dice
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
